apiVersion: v1
kind: ConfigMap
metadata:
  name: axiomrag-config
data:
  APP_ENV: production
  LOG_LEVEL: INFO
  QDRANT_URL: http://qdrant.example.internal:6333
  QDRANT_COLLECTION: axiomrag_documents
  REDIS_URL: redis://redis.example.internal:6379/0
  DATABASE_URL: postgresql+asyncpg://axiom@postgres.example.internal:5432/axiomrag
  AUTH_MODE: jwks
  JWT_JWKS_URL: https://identity.example.com/.well-known/jwks.json
  JWT_ISSUER: https://identity.example.com/
  JWT_AUDIENCE: axiomrag-api
  SQL_ALLOWED_TABLES: documents,document_chunks
  SQL_MAX_ROWS: "100"
  SQL_TIMEOUT_SECONDS: "5"
  ANSWER_MODEL: gpt-4o-mini
  ANSWER_BASE_URL: https://api.openai.com/v1
  ANSWER_CACHE_TTL_SECONDS: "300"

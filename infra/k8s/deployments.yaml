apiVersion: apps/v1
kind: Deployment
metadata:
  name: axiomrag-api
  labels: &labels
    app.kubernetes.io/name: axiomrag-api
    app.kubernetes.io/part-of: axiomrag
spec:
  replicas: 2
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: axiomrag
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: ghcr.io/example/axiomrag-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: axiomrag-config
            - secretRef:
                name: axiomrag-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: axiomrag-worker
  labels: &labels
    app.kubernetes.io/name: axiomrag-worker
    app.kubernetes.io/part-of: axiomrag
spec:
  replicas: 2
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: axiomrag
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: worker
          image: ghcr.io/example/axiomrag-worker:latest
          envFrom:
            - configMapRef:
                name: axiomrag-config
            - secretRef:
                name: axiomrag-secrets
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: axiomrag-web
  labels: &labels
    app.kubernetes.io/name: axiomrag-web
    app.kubernetes.io/part-of: axiomrag
spec:
  replicas: 2
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: web
          image: ghcr.io/example/axiomrag-web:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: axiomrag
  labels:
    app.kubernetes.io/part-of: axiomrag

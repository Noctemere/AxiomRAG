apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: axiomrag-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: axiomrag-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: axiomrag-worker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: axiomrag-worker
  policyTypes:
    - Egress
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: axiomrag-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: axiomrag-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - {}

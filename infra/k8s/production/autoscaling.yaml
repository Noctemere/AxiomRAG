apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: axiomrag-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: axiomrag-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: axiomrag-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: axiomrag-worker
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

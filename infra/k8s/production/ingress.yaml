apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: axiomrag
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: axiomrag.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: axiomrag-web
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: axiomrag-api
                port:
                  number: 8000

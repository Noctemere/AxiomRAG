  selector:
    matchLabels:
      app.kubernetes.io/name: axiomrag-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: axiomrag-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: axiomrag-worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: axiomrag-web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: axiomrag-web

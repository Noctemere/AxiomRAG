apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: axiomrag
resources:
  - ../
  - ingress.yaml
  - autoscaling.yaml
  - disruption-budgets.yaml
  - network-policy.yaml
images:
  - name: ghcr.io/example/axiomrag-api
    newName: ghcr.io/your-org/axiomrag-api
    newTag: latest
  - name: ghcr.io/example/axiomrag-worker
    newName: ghcr.io/your-org/axiomrag-worker
    newTag: latest
  - name: ghcr.io/example/axiomrag-web
    newName: ghcr.io/your-org/axiomrag-web
    newTag: latest
